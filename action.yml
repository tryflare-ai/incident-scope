name: 'Flare Incident Scope'
description: 'On-demand audit log analysis for security incidents. Analyzes a time window and creates a GitHub Issue.'
author: 'Flare AI'

branding:
  icon: 'alert-circle'
  color: 'red'

inputs:
  token:
    description: 'Flare API key (starts with flr_pr_). Generate one from Settings at tryflare.ai.'
    required: true
  time-from:
    description: 'Start of incident window (ISO 8601, e.g. 2026-01-15T02:00:00Z).'
    required: true
  time-to:
    description: 'End of incident window (ISO 8601). Defaults to current time if empty.'
    required: false
    default: ''
  connector-id:
    description: 'Flare connector ID. If omitted, uses the most recently created active connector.'
    required: false
  severity-filter:
    description: 'Minimum severity floor for timeline entries: all, medium, high, critical.'
    required: false
    default: 'all'
  api-url:
    description: 'Flare API endpoint URL. Override only for self-hosted or staging.'
    required: false
    default: 'https://tryflare.ai/api/webhooks/incident-scope'

outputs:
  issue-url:
    description: 'URL of the created GitHub Issue with incident findings.'
    value: ${{ steps.scope.outputs.issue_url }}
  total-events:
    description: 'Total number of audit log events analyzed.'
    value: ${{ steps.scope.outputs.total_events }}
  truncated:
    description: 'Whether the log set was truncated due to volume (true/false).'
    value: ${{ steps.scope.outputs.truncated }}

runs:
  using: 'composite'
  steps:
    - name: Flare incident scope analysis
      id: scope
      shell: bash
      # Expressions are passed only through the environment and referenced as
      # quoted shell variables; never interpolate ${{ }} into the script body.
      env:
        GH_TOKEN: ${{ github.token }}
        FLARE_TOKEN: ${{ inputs.token }}
        FLARE_API_URL: ${{ inputs.api-url }}
        TIME_FROM_INPUT: ${{ inputs.time-from }}
        TIME_TO_INPUT: ${{ inputs.time-to }}
        CONNECTOR_ID: ${{ inputs.connector-id }}
        SEVERITY_FILTER: ${{ inputs.severity-filter }}
        REPO: ${{ github.repository }}
        ACTOR: ${{ github.actor }}
      run: |
        set -euo pipefail

        write_empty_outputs() {
          {
            echo "issue_url="
            echo "total_events=0"
            echo "truncated=false"
          } >> "$GITHUB_OUTPUT"
        }

        if [ -z "$FLARE_TOKEN" ]; then
          echo "::error::Flare: no API key provided. Set the token input (for example from secrets.FLARE_API_KEY)."
          write_empty_outputs
          exit 1
        fi
        echo "::add-mask::$FLARE_TOKEN"

        WORK_DIR="${RUNNER_TEMP:-/tmp}"
        PAYLOAD_FILE=$(mktemp "$WORK_DIR/flare-scope-payload.XXXXXX")
        RESPONSE_FILE=$(mktemp "$WORK_DIR/flare-scope-response.XXXXXX")
        trap 'rm -f "$PAYLOAD_FILE" "$RESPONSE_FILE"' EXIT

        # ── Build JSON payload ─────────────────────────────────────
        jq -n \
          --arg time_from "$TIME_FROM_INPUT" \
          --arg time_to "$TIME_TO_INPUT" \
          --arg connector_id "$CONNECTOR_ID" \
          --arg severity_filter "$SEVERITY_FILTER" \
          --arg repo "$REPO" \
          --arg triggered_by "$ACTOR" \
          '{
            time_from: $time_from,
            severity_filter: $severity_filter,
            metadata: {
              repo: $repo,
              triggered_by: $triggered_by
            }
          }
          | if $time_to != "" then .time_to = $time_to else . end
          | if $connector_id != "" then .connector_id = $connector_id else . end' > "$PAYLOAD_FILE"

        # ── Call Flare API ─────────────────────────────────────────
        echo "::notice::Flare: analyzing audit logs from $TIME_FROM_INPUT..."

        HTTP_CODE=$(curl -sS -o "$RESPONSE_FILE" -w '%{http_code}' \
          --max-time 120 \
          -X POST "$FLARE_API_URL" \
          -H "Authorization: Bearer $FLARE_TOKEN" \
          -H "Content-Type: application/json" \
          --data-binary @"$PAYLOAD_FILE") || HTTP_CODE="000"
        HTTP_BODY=$(cat "$RESPONSE_FILE")

        # ── Handle errors ──────────────────────────────────────────
        if [ "$HTTP_CODE" != "200" ]; then
          ERROR_MSG=$(printf '%s' "$HTTP_BODY" | jq -r '.error // "Unknown error"' 2>/dev/null || echo "HTTP $HTTP_CODE")

          case "$HTTP_CODE" in
            400)
              echo "::error::Flare: invalid request. $ERROR_MSG"
              ;;
            401)
              echo "::error::Flare: authentication failed. $ERROR_MSG"
              ;;
            429)
              echo "::error::Flare: daily analysis limit reached (10/day). Try again tomorrow."
              ;;
            502|503)
              echo "::error::Flare: analysis service temporarily unavailable. Try re-running."
              ;;
            000)
              echo "::error::Flare: could not reach the Flare API."
              ;;
            *)
              echo "::error::Flare: API error ($HTTP_CODE): $ERROR_MSG"
              ;;
          esac

          write_empty_outputs
          exit 1
        fi

        # ── Parse response ─────────────────────────────────────────
        TOTAL_EVENTS=$(jq -r '.total_logs_analyzed' "$RESPONSE_FILE")
        TRUNCATED=$(jq -r '.truncated' "$RESPONSE_FILE")
        EVENTS_DROPPED=$(jq -r '.events_dropped' "$RESPONSE_FILE")
        NARRATIVE=$(jq -r '.narrative' "$RESPONSE_FILE")
        TIME_FROM=$(jq -r '.time_window.from' "$RESPONSE_FILE")
        TIME_TO=$(jq -r '.time_window.to' "$RESPONSE_FILE")
        TIMELINE_COUNT=$(jq '.timeline | length' "$RESPONSE_FILE")

        {
          echo "total_events=$TOTAL_EVENTS"
          echo "truncated=$TRUNCATED"
        } >> "$GITHUB_OUTPUT"

        # ── Handle empty results ───────────────────────────────────
        if [ "$TOTAL_EVENTS" = "0" ]; then
          echo "::notice::Flare: no audit log events found in the specified time window."
          echo "issue_url=" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        # ── Build GitHub Issue body ────────────────────────────────
        ISSUE_TITLE="Incident Scope: ${TIME_FROM} to ${TIME_TO}"

        CRITICAL_COUNT=$(jq '[.timeline[] | select(.severity == "critical")] | length' "$RESPONSE_FILE")
        HIGH_COUNT=$(jq '[.timeline[] | select(.severity == "high")] | length' "$RESPONSE_FILE")
        MEDIUM_COUNT=$(jq '[.timeline[] | select(.severity == "medium")] | length' "$RESPONSE_FILE")

        SEV_PARTS=""
        [ "$CRITICAL_COUNT" -gt 0 ] && SEV_PARTS="**$CRITICAL_COUNT critical**"
        [ "$HIGH_COUNT" -gt 0 ] && SEV_PARTS="${SEV_PARTS:+$SEV_PARTS, }**$HIGH_COUNT high**"
        [ "$MEDIUM_COUNT" -gt 0 ] && SEV_PARTS="${SEV_PARTS:+$SEV_PARTS, }$MEDIUM_COUNT medium"

        TIMELINE_ROWS=$(jq -r '.timeline[] | "| \(.timestamp) | \(.service) | \(.actor) | \(.action) | \(.severity) |"' "$RESPONSE_FILE")

        # printf '%s' keeps model output literal (no format-string or
        # backslash interpretation).
        ISSUE_BODY=$(
          printf '## Incident Scope: %s to %s\n\n' "$TIME_FROM" "$TIME_TO"
          printf '**Analyzed:** %s audit log events\n' "$TOTAL_EVENTS"
          printf '**Timeline events:** %s (%s)\n' "$TIMELINE_COUNT" "${SEV_PARTS:-none above threshold}"
          if [ "$TRUNCATED" = "true" ]; then
            printf '**Truncated:** yes (%s events dropped, severity-prioritized)\n' "$EVENTS_DROPPED"
          fi
          printf '\n---\n\n### Narrative\n\n%s\n\n### Timeline\n\n' "$NARRATIVE"
          printf '| Time | Service | Actor | Action | Severity |\n'
          printf '|------|---------|-------|--------|----------|\n'
          printf '%s\n' "$TIMELINE_ROWS"
          printf '\n---\n\n> Powered by [Flare](https://tryflare.ai) | Triggered by @%s via workflow_dispatch\n' "$ACTOR"
        )

        # ── Create GitHub Issue ────────────────────────────────────
        ISSUE_URL=$(gh issue create --repo "$REPO" \
          --title "$ISSUE_TITLE" \
          --body "$ISSUE_BODY" \
          --label "incident" 2>/dev/null || \
        gh issue create --repo "$REPO" \
          --title "$ISSUE_TITLE" \
          --body "$ISSUE_BODY" 2>/dev/null) || ISSUE_URL=""

        echo "issue_url=$ISSUE_URL" >> "$GITHUB_OUTPUT"

        if [ -z "$ISSUE_URL" ]; then
          echo "::error::Flare: analysis completed but the GitHub Issue could not be created. Ensure the workflow has issues: write permission."
          exit 1
        fi

        echo "::notice::Flare: incident scope complete. $TOTAL_EVENTS events analyzed, $TIMELINE_COUNT timeline entries. Issue: $ISSUE_URL"
